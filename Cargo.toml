[workspace]
resolver = "3"
members = ["crates/pi-rpc", "crates/pi-bridge", "crates/pi-store", "crates/pi-desktop"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"
publish = false

[workspace.dependencies]
pi-rpc = { path = "crates/pi-rpc" }
pi-bridge = { path = "crates/pi-bridge" }
pi-store = { path = "crates/pi-store" }
async-channel = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
